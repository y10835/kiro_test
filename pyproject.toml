[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-analytics-lib"
version = "0.1.0"
description = "Personal HR analytics library — synthetic data generation and workforce metrics with property-based testing"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
]
parquet = [
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
include = ["hr_analytics_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
